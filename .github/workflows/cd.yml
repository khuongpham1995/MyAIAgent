name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Previously built commit on main to redeploy or roll back
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aca-release
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_image: ${{ steps.images.outputs.gateway_image }}
      orchestrator_image: ${{ steps.images.outputs.orchestrator_image }}
      kernel_memory_image: ${{ steps.images.outputs.kernel_memory_image }}
      mcp_image: ${{ steps.images.outputs.mcp_image }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      APP_ENVIRONMENT_NAME: ${{ vars.APP_ENVIRONMENT_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      GATEWAY_IDENTITY_NAME: ${{ vars.GATEWAY_IDENTITY_NAME }}
      ORCHESTRATOR_IDENTITY_NAME: ${{ vars.ORCHESTRATOR_IDENTITY_NAME }}
      KERNEL_MEMORY_IDENTITY_NAME: ${{ vars.KERNEL_MEMORY_IDENTITY_NAME }}
      MCP_IDENTITY_NAME: ${{ vars.MCP_IDENTITY_NAME }}
      APP_CONFIG_ENDPOINT: ${{ vars.APP_CONFIG_ENDPOINT }}
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_EMBEDDING_DEPLOYMENT }}
      AZURE_TEXT_DEPLOYMENT: ${{ vars.AZURE_TEXT_DEPLOYMENT }}
      GOOGLE_SEARCH_ENGINE_ID: ${{ vars.GOOGLE_SEARCH_ENGINE_ID }}
      SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
      PUBLIC_CHAT_ISSUER: ${{ vars.PUBLIC_CHAT_ISSUER }}
      PUBLIC_CHAT_AUDIENCE: ${{ vars.PUBLIC_CHAT_AUDIENCE }}
      PUBLIC_CHAT_JWKS_URI: ${{ vars.PUBLIC_CHAT_JWKS_URI }}
      PUBLIC_CHAT_SIGNING_KEY_SECRET: ${{ vars.PUBLIC_CHAT_SIGNING_KEY_SECRET }}
      PUBLIC_CHAT_AGENT_ID: ${{ vars.PUBLIC_CHAT_AGENT_ID }}
      PUBLIC_CHAT_ALLOWED_ORIGIN: ${{ vars.PUBLIC_CHAT_ALLOWED_ORIGIN }}
    steps:
      - name: Checkout delivery tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source
      - name: Validate release commit
        working-directory: release-source
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install automation dependencies
        run: npm ci --ignore-scripts
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and resolve immutable images
        id: images
        working-directory: release-source
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            az acr login --name "$ACR_NAME"
          fi
          for service in Gateway Orchestrator KernelMemory McpServer; do
            repository="myaiagent-${service,,}"
            tag="$login_server/$repository:$RELEASE_SHA"
            if [[ "${{ github.event_name }}" == workflow_run ]]; then
              docker build --build-arg "SERVICE=$service" --tag "$tag" .
              docker push "$tag"
            fi
            digest=$(az acr manifest show-metadata --registry "$ACR_NAME" \
              --name "$repository:$RELEASE_SHA" --query digest --output tsv)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            case "$service" in
              Gateway) output=gateway_image ;;
              Orchestrator) output=orchestrator_image ;;
              KernelMemory) output=kernel_memory_image ;;
              McpServer) output=mcp_image ;;
            esac
            echo "$output=$login_server/$repository@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Deploy staging
        id: deploy
        env:
          GATEWAY_IMAGE: ${{ steps.images.outputs.gateway_image }}
          ORCHESTRATOR_IMAGE: ${{ steps.images.outputs.orchestrator_image }}
          KERNEL_MEMORY_IMAGE: ${{ steps.images.outputs.kernel_memory_image }}
          MCP_IMAGE: ${{ steps.images.outputs.mcp_image }}
        run: npm run deploy:aca -- staging "$GATEWAY_IMAGE" "$ORCHESTRATOR_IMAGE" "$KERNEL_MEMORY_IMAGE" "$MCP_IMAGE"
      - name: Smoke test staging
        env:
          GATEWAY_FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: npm run deploy:smoke -- "$GATEWAY_FQDN" "$ENTRA_AUDIENCE"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      APP_ENVIRONMENT_NAME: ${{ vars.APP_ENVIRONMENT_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      GATEWAY_IDENTITY_NAME: ${{ vars.GATEWAY_IDENTITY_NAME }}
      ORCHESTRATOR_IDENTITY_NAME: ${{ vars.ORCHESTRATOR_IDENTITY_NAME }}
      KERNEL_MEMORY_IDENTITY_NAME: ${{ vars.KERNEL_MEMORY_IDENTITY_NAME }}
      MCP_IDENTITY_NAME: ${{ vars.MCP_IDENTITY_NAME }}
      APP_CONFIG_ENDPOINT: ${{ vars.APP_CONFIG_ENDPOINT }}
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_EMBEDDING_DEPLOYMENT }}
      AZURE_TEXT_DEPLOYMENT: ${{ vars.AZURE_TEXT_DEPLOYMENT }}
      GOOGLE_SEARCH_ENGINE_ID: ${{ vars.GOOGLE_SEARCH_ENGINE_ID }}
      SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
      PUBLIC_CHAT_ISSUER: ${{ vars.PUBLIC_CHAT_ISSUER }}
      PUBLIC_CHAT_AUDIENCE: ${{ vars.PUBLIC_CHAT_AUDIENCE }}
      PUBLIC_CHAT_JWKS_URI: ${{ vars.PUBLIC_CHAT_JWKS_URI }}
      PUBLIC_CHAT_SIGNING_KEY_SECRET: ${{ vars.PUBLIC_CHAT_SIGNING_KEY_SECRET }}
      PUBLIC_CHAT_AGENT_ID: ${{ vars.PUBLIC_CHAT_AGENT_ID }}
      PUBLIC_CHAT_ALLOWED_ORIGIN: ${{ vars.PUBLIC_CHAT_ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install automation dependencies
        run: npm ci --ignore-scripts
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy production
        id: deploy
        env:
          GATEWAY_IMAGE: ${{ needs.staging.outputs.gateway_image }}
          ORCHESTRATOR_IMAGE: ${{ needs.staging.outputs.orchestrator_image }}
          KERNEL_MEMORY_IMAGE: ${{ needs.staging.outputs.kernel_memory_image }}
          MCP_IMAGE: ${{ needs.staging.outputs.mcp_image }}
        run: npm run deploy:aca -- production "$GATEWAY_IMAGE" "$ORCHESTRATOR_IMAGE" "$KERNEL_MEMORY_IMAGE" "$MCP_IMAGE"
      - name: Smoke test production
        env:
          GATEWAY_FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: npm run deploy:smoke -- "$GATEWAY_FQDN" "$ENTRA_AUDIENCE"
