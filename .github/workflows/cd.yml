name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Previously built commit on main to redeploy or roll back
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aca-release
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_image: ${{ steps.images.outputs.gateway_image }}
      orchestrator_image: ${{ steps.images.outputs.orchestrator_image }}
      kernel_memory_image: ${{ steps.images.outputs.kernel_memory_image }}
      mcp_image: ${{ steps.images.outputs.mcp_image }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      APP_ENVIRONMENT_NAME: ${{ vars.APP_ENVIRONMENT_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      RUNTIME_IDENTITY_NAME: ${{ vars.RUNTIME_IDENTITY_NAME }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_EMBEDDING_DEPLOYMENT }}
      AZURE_TEXT_DEPLOYMENT: ${{ vars.AZURE_TEXT_DEPLOYMENT }}
      GOOGLE_SEARCH_ENGINE_ID: ${{ vars.GOOGLE_SEARCH_ENGINE_ID }}
      SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
      PUBLIC_CHAT_ISSUER: ${{ vars.PUBLIC_CHAT_ISSUER }}
      PUBLIC_CHAT_AUDIENCE: ${{ vars.PUBLIC_CHAT_AUDIENCE }}
      PUBLIC_CHAT_JWKS_URI: ${{ vars.PUBLIC_CHAT_JWKS_URI }}
      PUBLIC_CHAT_SIGNING_KEY_SECRET: ${{ vars.PUBLIC_CHAT_SIGNING_KEY_SECRET }}
      PUBLIC_CHAT_AGENT_ID: ${{ vars.PUBLIC_CHAT_AGENT_ID }}
      PUBLIC_CHAT_ALLOWED_ORIGIN: ${{ vars.PUBLIC_CHAT_ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Validate release commit
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and resolve immutable images
        id: images
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            az acr login --name "$ACR_NAME"
          fi
          for service in Gateway Orchestrator KernelMemory McpServer; do
            repository="myaiagent-${service,,}"
            tag="$login_server/$repository:$RELEASE_SHA"
            if [[ "${{ github.event_name }}" == workflow_run ]]; then
              docker build --build-arg "SERVICE=$service" --tag "$tag" .
              docker push "$tag"
            fi
            digest=$(az acr manifest show-metadata --registry "$ACR_NAME" \
              --name "$repository:$RELEASE_SHA" --query digest --output tsv)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            case "$service" in
              Gateway) output=gateway_image ;;
              Orchestrator) output=orchestrator_image ;;
              KernelMemory) output=kernel_memory_image ;;
              McpServer) output=mcp_image ;;
            esac
            echo "$output=$login_server/$repository@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Deploy staging
        id: deploy
        run: |
          fqdn=$(bash scripts/deploy/aca.sh staging \
            '${{ steps.images.outputs.gateway_image }}' \
            '${{ steps.images.outputs.orchestrator_image }}' \
            '${{ steps.images.outputs.kernel_memory_image }}' \
            '${{ steps.images.outputs.mcp_image }}')
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
      - name: Smoke test staging
        run: bash scripts/deploy/smoke.sh '${{ steps.deploy.outputs.fqdn }}' "$ENTRA_AUDIENCE"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      APP_ENVIRONMENT_NAME: ${{ vars.APP_ENVIRONMENT_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      RUNTIME_IDENTITY_NAME: ${{ vars.RUNTIME_IDENTITY_NAME }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_EMBEDDING_DEPLOYMENT }}
      AZURE_TEXT_DEPLOYMENT: ${{ vars.AZURE_TEXT_DEPLOYMENT }}
      GOOGLE_SEARCH_ENGINE_ID: ${{ vars.GOOGLE_SEARCH_ENGINE_ID }}
      SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
      PUBLIC_CHAT_ISSUER: ${{ vars.PUBLIC_CHAT_ISSUER }}
      PUBLIC_CHAT_AUDIENCE: ${{ vars.PUBLIC_CHAT_AUDIENCE }}
      PUBLIC_CHAT_JWKS_URI: ${{ vars.PUBLIC_CHAT_JWKS_URI }}
      PUBLIC_CHAT_SIGNING_KEY_SECRET: ${{ vars.PUBLIC_CHAT_SIGNING_KEY_SECRET }}
      PUBLIC_CHAT_AGENT_ID: ${{ vars.PUBLIC_CHAT_AGENT_ID }}
      PUBLIC_CHAT_ALLOWED_ORIGIN: ${{ vars.PUBLIC_CHAT_ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy production
        id: deploy
        run: |
          fqdn=$(bash scripts/deploy/aca.sh production \
            '${{ needs.staging.outputs.gateway_image }}' \
            '${{ needs.staging.outputs.orchestrator_image }}' \
            '${{ needs.staging.outputs.kernel_memory_image }}' \
            '${{ needs.staging.outputs.mcp_image }}')
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
      - name: Smoke test production
        run: bash scripts/deploy/smoke.sh '${{ steps.deploy.outputs.fqdn }}' "$ENTRA_AUDIENCE"
