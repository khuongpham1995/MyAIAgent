# Runs pull-request and main-branch quality, infrastructure validation, and credential-scanning checks.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare solution for testing
        uses: ./.github/actions/netcore_tests/prepare_solution_for_testing
      - name: Run full quality gate
        uses: ./.github/actions/netcore_tests/run_tests
        with:
          base-ref: ${{ github.base_ref }}
          before-sha: ${{ github.event.before }}
      - name: Compile infrastructure templates
        uses: ./.github/actions/compile_infrastructure_templates
      - name: Validate GitHub workflows
        uses: ./.github/actions/validate_github_workflows

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install automation dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository protection policy
        run: node --test --import tsx scripts/security/*.test.ts
      - name: Scan history and checked-out files for secrets
        run: npm run security:scan
