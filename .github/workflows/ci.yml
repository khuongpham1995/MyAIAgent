name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run full quality gate
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE_SHA^{commit}"; then
            base=$(git merge-base HEAD "$BEFORE_SHA")
          else
            base=HEAD
          fi
          node scripts/ai/quality.mjs --base "$base"
      - name: Compile infrastructure templates
        run: |
          az bicep install --version v0.47.16
          for template in infra/*.bicep; do
            az bicep build --file "$template" --outfile "/tmp/$(basename "$template" .bicep).json"
          done
      - name: Validate GitHub workflows
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
