# Schedules dependency-update proposals for the configured package ecosystems.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the selected free-license release lines; review licensing before any major migration.
    ignore:
      - dependency-name: MediatR
        update-types: ["version-update:semver-major"]
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
