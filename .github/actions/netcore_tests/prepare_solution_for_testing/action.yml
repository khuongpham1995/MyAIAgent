# Installs the SDK and locked automation dependencies needed by the shared quality gate.

name: Prepare solution for testing
description: Install the Node.js and .NET SDK versions used by the quality gate.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
    - name: Install automation dependencies
      shell: bash
      run: npm ci --ignore-scripts
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'
